# Keeps the update channels in sync with the releases of this repository.
#
#   channels/beta.json    newest published release (pre-release or release)
#   channels/stable.json  newest release that is NOT a pre-release
#
# A new firmware arrives as a pre-release (beta). Marking it as a full release
# ("Set as the latest release", untick "Set as a pre-release") makes it stable.
name: channels

on:
  release:
    types: [published, released, prereleased, edited]
  push:
    branches: [main]
    paths: [".github/workflows/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: channels
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild channel files from all releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p channels
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" > releases.json
          python3 .github/workflows/pick_channels.py releases.json channels
          rm -f releases.json
      - name: Commit
        run: |
          git config user.name "release-bot"
          git config user.email "release-bot@users.noreply.github.com"
          git add channels
          git diff --cached --quiet && { echo "channels unchanged"; exit 0; }
          git commit -m "update channels"
          git push
